spring.application.name=GateaaWayApplication

server.port=9000

spring.cloud.gateway.server.webflux.routes[0].id=ProductApplication
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ProductApplication
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/products/**

spring.cloud.gateway.server.webflux.routes[1].id=CartApplication
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CartApplication
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/carts/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true